# 环境变量从同级 profile 文件加载：
#   docker compose --env-file profile up -d

services:
  etcd:
    restart: always
    image: quay.io/coreos/etcd:v3.5.15
    container_name: personal-etcd
    environment:
      - ETCD_NAME=etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      - ETCD_DATA_DIR=/etcd-data
    ports:
      - "127.0.0.1:2379:2379"
      - "127.0.0.1:2380:2380"
    volumes:
      - ${DATA_HOME}/etcd/data:/etcd-data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mysql:
    restart: always
    image: mysql:${mysql_version}
    container_name: personal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ${DATA_HOME}/mysql/data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    restart: always
    image: redis:${redis_version}
    container_name: personal-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_HOME}/redis/data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    restart: always
    image: minio/minio:${minio_version}
    container_name: personal-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${DATA_HOME}/minio/data:/data
      - /etc/localtime:/etc/localtime:ro

  personal-auth:
    restart: always
    image: registry.cn-beijing.aliyuncs.com/eviltomorrow/personal-auth:${personal_auth_version:-7.0.5}
    container_name: personal-auth
    ports:
      - "127.0.0.1:50001:50001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    volumes:
      - ./conf/personal-auth/config.toml:/app/etc/config.toml
      - /etc/localtime:/etc/localtime:ro

  personal-api:
    restart: always
    image: registry.cn-beijing.aliyuncs.com/eviltomorrow/personal-api:${personal_api_version:-7.0.5}
    container_name: personal-api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./conf/personal-api/config.toml:/app/etc/config.toml
      - /etc/localtime:/etc/localtime:ro

  personal-web:
    restart: always
    image: registry.cn-beijing.aliyuncs.com/eviltomorrow/personal-web:0.1.0
    container_name: personal-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_HOST=http://personal-api:8080

networks:
  default:
    name: net-personal
    external: true
