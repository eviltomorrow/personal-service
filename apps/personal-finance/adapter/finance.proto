syntax = "proto3";

package personal.finance;

option go_package = "github.com/eviltomorrow/personal-service/apps/personal-finance/adapter/pb";

import "google/protobuf/empty.proto";

enum FinanceType {
  FINANCE_TYPE_UNSPECIFIED = 0;
  FINANCE_TYPE_INCOME = 1;
  FINANCE_TYPE_EXPENSE = 2;
}

message Category {
  int64 id = 1;
  string account_id = 2;
  string name = 3;
  FinanceType type = 4;
  int32 sort_order = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message Transaction {
  int64 id = 1;
  string account_id = 2;
  int64 category_id = 3;
  FinanceType type = 4;
  string name = 5;
  double amount = 6;
  string date = 7;
  string note = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  string name = 1;
  FinanceType type = 2;
  int32 sort_order = 3;
}

message UpdateCategoryRequest {
  int64 id = 1;
  string name = 2;
  FinanceType type = 3;
  int32 sort_order = 4;
}

message DeleteCategoryRequest {
  int64 id = 1;
}

message ListTransactionsRequest {
  int32 year = 1;
  int32 month = 2;
  int64 category_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

message CreateTransactionRequest {
  int64 category_id = 1;
  FinanceType type = 2;
  string name = 3;
  double amount = 4;
  string date = 5;
  string note = 6;
}

message UpdateTransactionRequest {
  int64 id = 1;
  int64 category_id = 2;
  FinanceType type = 3;
  string name = 4;
  double amount = 5;
  string date = 6;
  string note = 7;
}

message DeleteTransactionRequest {
  int64 id = 1;
}

service Finance {
  rpc ListCategories(google.protobuf.Empty) returns (ListCategoriesResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc UpdateCategory(UpdateCategoryRequest) returns (Category);
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty);

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc CreateTransaction(CreateTransactionRequest) returns (Transaction);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (Transaction);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (google.protobuf.Empty);
}
